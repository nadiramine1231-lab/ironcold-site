<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin | IRONCOLD</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07080a">
  <link rel="icon" type="image/png" href="favicon_icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/ironcold.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="adm">

  <!-- LOGIN -->
  <section class="login" id="login">
    <form class="login__card" id="loginForm">
      <img src="images/web/emblem-white.png" alt="" class="login__emblem" width="347" height="512">
      <img src="logo1_nobg.png" alt="IRONCOLD" class="login__logo" width="704" height="207">
      <p>Tableau de bord du site</p>
      <label class="field"><span>Mot de passe</span><input type="password" id="loginPass" autocomplete="current-password" required></label>
      <label class="login__remember"><input type="checkbox" id="loginRemember" checked> Rester connecté sur cet appareil</label>
      <p class="login__err" id="loginErr"></p>
      <button class="btn btn--ice btn--block" type="submit">Entrer</button>
    </form>
  </section>

  <!-- APP -->
  <div class="app" id="app" hidden>
    <aside class="side">
      <a class="side__brand" href="admin.html"><img src="logo1_nobg.png" alt="IRONCOLD" width="704" height="207"><span>Admin</span></a>
      <nav class="side__nav" id="sideNav">
        <button type="button" data-view="overview"><span>◎</span>Aperçu</button>
        <button type="button" data-view="editor"><span>✎</span>Éditeur visuel</button>
        <button type="button" data-view="products"><span>▦</span>Produits</button>
        <button type="button" data-view="categories"><span>◫</span>Catégories</button>
        <button type="button" data-view="settings"><span>☰</span>Annonces &amp; contact</button>
        <button type="button" data-view="orders"><span>⌁</span>Commandes</button>
      </nav>
      <div class="side__foot">
        <a href="index.html" target="_blank" rel="noopener">Voir le site ↗</a>
        <button type="button" id="logoutBtn">Se déconnecter</button>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <button class="top__menu" type="button" id="menuBtn" aria-label="Menu">☰</button>
        <h1 class="top__title" id="viewTitle">Aperçu</h1>
        <div class="top__state" id="draftState"></div>
        <button class="btn btn--ghost top__btn" type="button" id="discardBtn" hidden>Annuler</button>
        <button class="btn btn--ice top__btn" type="button" id="publishBtn" disabled>Publier</button>
      </header>

      <div class="view" id="view"></div>
    </main>
  </div>

  <div class="adm-toast" id="toast" role="status"></div>
  <input type="file" id="filePick" accept="image/*" multiple hidden>

  <script src="js/admin.js"></script>
</body>
</html>
